<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .wave1 { stroke: #58a6ff; }
      .wave2 { stroke: #3fb950; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .wave1 { stroke: #0969da; }
      .wave2 { stroke: #1a7f37; }
    }

    .wave1, .wave2 {
      fill: none;
      stroke-width: 1.2;
      opacity: 0.35;
    }

    @keyframes scroll1 {
      from { transform: translateX(0); }
      to   { transform: translateX(-800px); }
    }
    @keyframes scroll2 {
      from { transform: translateX(0); }
      to   { transform: translateX(-800px); }
    }

    .track1 { animation: scroll1 12s linear infinite; }
    .track2 { animation: scroll2 18s linear infinite; }
  </style>

  <rect class="bg" width="800" height="60"/>

  <!-- Wave 1 — two repeating tiles scrolling left -->
  <g class="track1">
    <!-- tile 0..799 -->
    <path class="wave1" d="
      M0,30
      C40,10 80,50 120,30
      C160,10 200,50 240,30
      C280,10 320,50 360,30
      C400,10 440,50 480,30
      C520,10 560,50 600,30
      C640,10 680,50 720,30
      C760,10 800,50 800,30
    "/>
    <!-- tile 800..1599 -->
    <path class="wave1" d="
      M800,30
      C840,10 880,50 920,30
      C960,10 1000,50 1040,30
      C1080,10 1120,50 1160,30
      C1200,10 1240,50 1280,30
      C1320,10 1360,50 1400,30
      C1440,10 1480,50 1520,30
      C1560,10 1600,50 1600,30
    "/>
  </g>

  <!-- Wave 2 — offset phase, slower -->
  <g class="track2">
    <path class="wave2" d="
      M0,30
      C50,50 100,10 150,30
      C200,50 250,10 300,30
      C350,50 400,10 450,30
      C500,50 550,10 600,30
      C650,50 700,10 750,30
      C800,50 800,10 800,30
    "/>
    <path class="wave2" d="
      M800,30
      C850,50 900,10 950,30
      C1000,50 1050,10 1100,30
      C1150,50 1200,10 1250,30
      C1300,50 1350,10 1400,30
      C1450,50 1500,10 1550,30
      C1600,50 1600,10 1600,30
    "/>
  </g>
</svg>
