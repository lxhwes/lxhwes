<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Alex Howes">
  <style>
    :root {
      --fg: #1a1a1a;
      --accent: #4a6fa5;
      --line: rgba(26, 26, 26, 0.18);
      --line-accent: rgba(74, 111, 165, 0.35);
      --bg: #f8f8f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8e8;
        --accent: #7ba3d4;
        --line: rgba(232, 232, 232, 0.15);
        --line-accent: rgba(123, 163, 212, 0.30);
        --bg: #111111;
      }
    }
    .bg { fill: var(--bg); }
    .geo-line { stroke: var(--line); stroke-width: 0.8; fill: none; }
    .geo-accent { stroke: var(--line-accent); stroke-width: 1.2; fill: none; }
    .name {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 28px;
      font-weight: 400;
      fill: var(--fg);
      letter-spacing: 0.04em;
    }
    .email {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 400;
      fill: var(--accent);
      letter-spacing: 0.08em;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="800" height="200"/>

  <!-- Geometric grid: slow-rotating square grid centered left -->
  <g transform="translate(400, 100)">

    <!-- Rotating outer frame group -->
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="120s" repeatCount="indefinite"/>
      <!-- Concentric squares -->
      <rect class="geo-line" x="-160" y="-160" width="320" height="320"/>
      <rect class="geo-line" x="-120" y="-120" width="240" height="240"/>
      <rect class="geo-line" x="-80" y="-80" width="160" height="160"/>
      <rect class="geo-line" x="-40" y="-40" width="80" height="80"/>
      <!-- Cross lines -->
      <line class="geo-line" x1="-160" y1="0" x2="160" y2="0"/>
      <line class="geo-line" x1="0" y1="-160" x2="0" y2="160"/>
      <!-- Diagonals -->
      <line class="geo-line" x1="-160" y1="-160" x2="160" y2="160"/>
      <line class="geo-line" x1="160" y1="-160" x2="-160" y2="160"/>
    </g>

    <!-- Counter-rotating inner diamond -->
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate"
        from="45" to="405" dur="80s" repeatCount="indefinite"/>
      <rect class="geo-accent" x="-55" y="-55" width="110" height="110"/>
      <rect class="geo-accent" x="-30" y="-30" width="60" height="60"/>
    </g>

    <!-- Slowly pulsing center dot -->
    <circle r="3" fill="var(--accent)" opacity="0.6">
      <animate attributeName="r" values="2;4;2" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Right-side slow morphing polygon -->
  <g transform="translate(650, 100)" opacity="0.5">
    <polygon class="geo-accent" points="0,-70 60,35 -60,35">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="-360" dur="90s" repeatCount="indefinite"/>
    </polygon>
    <polygon class="geo-line" points="0,-45 39,22 -39,22">
      <animateTransform attributeName="transform" type="rotate"
        from="60" to="420" dur="70s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Left-side slow rotating hexagon shape -->
  <g transform="translate(130, 100)" opacity="0.4">
    <polygon class="geo-accent" points="0,-65 56,32 56,32 0,65 -56,32 -56,-32">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="100s" repeatCount="indefinite"/>
    </polygon>
    <polygon class="geo-line" points="0,-40 35,20 -35,20">
      <animateTransform attributeName="transform" type="rotate"
        from="30" to="-330" dur="60s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Name text — bottom left area -->
  <text class="name" x="40" y="162">Alex Howes</text>
  <text class="email" x="40" y="181">alex@howes.dev</text>

</svg>
