<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes glitch-1 {
          0%, 92%, 100% { clip-path: inset(0 0 0 0); opacity: 0; }
          93% { clip-path: inset(20% 0 40% 0); opacity: 1; transform: translateX(-3px); }
          94% { clip-path: inset(60% 0 5% 0); opacity: 1; transform: translateX(2px); }
          95% { clip-path: inset(10% 0 70% 0); opacity: 1; transform: translateX(-1px); }
          96% { clip-path: inset(0 0 0 0); opacity: 0; }
        }

        @keyframes glitch-2 {
          0%, 94%, 100% { clip-path: inset(0 0 0 0); opacity: 0; }
          95% { clip-path: inset(50% 0 10% 0); opacity: 1; transform: translateX(3px); }
          96% { clip-path: inset(15% 0 55% 0); opacity: 1; transform: translateX(-2px); }
          97% { clip-path: inset(70% 0 5% 0); opacity: 1; transform: translateX(1px); }
          98% { clip-path: inset(0 0 0 0); opacity: 0; }
        }

        @keyframes blink {
          0%, 49% { opacity: 1; }
          50%, 100% { opacity: 0; }
        }

        @keyframes scanline-drift {
          0% { background-position: 0 0; }
          100% { background-position: 0 4px; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container {
          width: 800px;
          height: 200px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-left: 48px;
          font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
          position: relative;
          background: #0d1117;
          overflow: hidden;
        }

        .name-wrap {
          position: relative;
          display: inline-block;
          width: fit-content;
        }

        .name {
          font-size: 42px;
          font-weight: 700;
          color: #e6edf3;
          letter-spacing: -0.5px;
          position: relative;
        }

        .name-glitch {
          position: absolute;
          top: 0;
          left: 0;
          font-size: 42px;
          font-weight: 700;
          letter-spacing: -0.5px;
          opacity: 0;
        }

        .name-glitch.cyan {
          color: #58a6ff;
          animation: glitch-1 6s infinite linear;
        }

        .name-glitch.red {
          color: #f85149;
          animation: glitch-2 6s infinite linear;
        }

        .cursor {
          display: inline-block;
          color: #e6edf3;
          font-size: 42px;
          font-weight: 700;
          animation: blink 1s step-end infinite;
          margin-left: 2px;
          vertical-align: baseline;
        }

        .subtitle {
          font-size: 18px;
          color: #8b949e;
          margin-top: 12px;
          letter-spacing: 0.5px;
        }

        .scanlines {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 2px,
            rgba(255,255,255,0.03) 2px,
            rgba(255,255,255,0.03) 4px
          );
          pointer-events: none;
          animation: scanline-drift 8s linear infinite;
        }

        /* Light mode */
        @media (prefers-color-scheme: light) {
          .container { background: #ffffff; }
          .name { color: #1f2328; }
          .cursor { color: #1f2328; }
          .subtitle { color: #656d76; }
          .name-glitch.cyan { color: #0969da; }
          .name-glitch.red { color: #cf222e; }
          .scanlines {
            background: repeating-linear-gradient(
              to bottom,
              transparent 0px,
              transparent 2px,
              rgba(0,0,0,0.02) 2px,
              rgba(0,0,0,0.02) 4px
            );
          }
        }
      </style>

      <div class="container">
        <div class="name-wrap">
          <span class="name">Alex Howes</span>
          <span class="name-glitch cyan" aria-hidden="true">Alex Howes</span>
          <span class="name-glitch red" aria-hidden="true">Alex Howes</span>
          <span class="cursor">▌</span>
        </div>
        <div class="subtitle">alex@howes.dev</div>
        <div class="scanlines"></div>
      </div>
    </div>
  </foreignObject>
</svg>
