<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .node { fill: #58a6ff; }
      .edge { stroke: #58a6ff; }
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .node { fill: #0969da; }
      .edge { stroke: #0969da; }
    }

    .node {
      opacity: 0.55;
    }
    .edge {
      stroke-width: 0.7;
      opacity: 0.18;
    }

    @keyframes drift1 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(4px, -3px); }
      66%  { transform: translate(-3px, 5px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-5px, 2px); }
      66%  { transform: translate(3px, -4px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift3 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(3px, 5px); }
      66%  { transform: translate(-4px, -2px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift4 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-2px, -5px); }
      66%  { transform: translate(5px, 3px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift5 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(5px, -2px); }
      66%  { transform: translate(-3px, 4px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift6 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(-4px, 3px); }
      66%  { transform: translate(2px, -5px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes drift7 {
      0%   { transform: translate(0px, 0px); }
      33%  { transform: translate(3px, -4px); }
      66%  { transform: translate(-5px, 2px); }
      100% { transform: translate(0px, 0px); }
    }

    .n1 { animation: drift1 18s ease-in-out infinite; }
    .n2 { animation: drift2 22s ease-in-out infinite; }
    .n3 { animation: drift3 16s ease-in-out infinite; }
    .n4 { animation: drift4 20s ease-in-out infinite; }
    .n5 { animation: drift5 24s ease-in-out infinite; }
    .n6 { animation: drift6 17s ease-in-out infinite; }
    .n7 { animation: drift7 21s ease-in-out infinite; }
  </style>

  <rect class="bg" width="800" height="120"/>

  <!-- Constellation edges — faint connecting lines between nodes -->
  <g class="edge">
    <line x1="110" y1="38" x2="245" y2="72"/>
    <line x1="245" y1="72" x2="380" y2="28"/>
    <line x1="380" y1="28" x2="520" y2="90"/>
    <line x1="520" y1="90" x2="660" y2="50"/>
    <line x1="660" y1="50" x2="740" y2="85"/>
    <line x1="380" y1="28" x2="245" y2="72"/>
    <line x1="520" y1="90" x2="380" y2="28"/>
    <line x1="60"  y1="90" x2="110" y2="38"/>
    <line x1="60"  y1="90" x2="245" y2="72"/>
  </g>

  <!-- Constellation nodes -->
  <g class="n1"><circle class="node" cx="110" cy="38" r="2.2"/></g>
  <g class="n2"><circle class="node" cx="245" cy="72" r="2.8"/></g>
  <g class="n3"><circle class="node" cx="380" cy="28" r="2.0"/></g>
  <g class="n4"><circle class="node" cx="520" cy="90" r="3.0"/></g>
  <g class="n5"><circle class="node" cx="660" cy="50" r="2.4"/></g>
  <g class="n6"><circle class="node" cx="740" cy="85" r="1.8"/></g>
  <g class="n7"><circle class="node" cx="60"  cy="90" r="2.2"/></g>
</svg>
